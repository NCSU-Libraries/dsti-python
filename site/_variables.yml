# One place for facts that appear on several pages and in the deck.
# The event is DSTI Day 2's Python track, from the Day 2 schedule: check-in 8:30, all-track wrap-up 11:30.

event:
  title: "Introduction to Programming with Python"
  series: "Data Science Training Intensive"
  date: "Tuesday, October 20, 2026"
  time: "9:00–11:30 am"
  room: "East Learning Lab A"
  page: ""

site: "https://ncsu-libraries.github.io/dsti-python/"
site-short: "ncsu-libraries.github.io/dsti-python"
go: "go.ncsu.edu/dsti-python"   # short link to the site, on the slides and the QR code
repo: "https://github.com/NCSU-Libraries/dsti-python"
help: "https://go.ncsu.edu/getdatahelp"
email: "lib-datascienceservices@ncsu.edu"
eval: "https://go.ncsu.edu/dss-workshop-eval"
workshops: "https://go.ncsu.edu/datavizworkshops"   # every DSS workshop, with dates; QR in images/qr-workshops.svg

# The session notebooks (built by tools/build_notebooks.py)
colab:
  learner: "https://colab.research.google.com/github/NCSU-Libraries/dsti-python/blob/main/notebooks/introduction-to-programming-with-python.ipynb"
  filled: "https://colab.research.google.com/github/NCSU-Libraries/dsti-python/blob/main/notebooks/introduction-to-programming-with-python-solutions.ipynb"

# Downloads of the same notebooks, relative to the site root. tools/copy_notebooks.py (Quarto post-render)
# copies notebooks/*.ipynb into _site/notebooks/.
download:
  learner: "notebooks/introduction-to-programming-with-python.ipynb"
  filled: "notebooks/introduction-to-programming-with-python-solutions.ipynb"

# The conda alternative to uv: conda-forge only, so the Anaconda defaults channel (and its Terms of Service prompt)
# is never touched. Keep python= in step with `python` below. Quarto reads var values as smart-typography markdown,
# so a bare -- becomes an en dash even in code blocks: escape each hyphen (\\-\\-).
conda:
  create: "conda create -y -n dss-python -c conda-forge \\-\\-override-channels python=3.13 jupyterlab matplotlib"

# The full workshops this session was built from
full:
  basics: "https://colab.research.google.com/github/NCSU-Libraries/getting-started-with-python/blob/main/workshops/basics/basics.ipynb"
  basics-filled: "https://colab.research.google.com/github/NCSU-Libraries/getting-started-with-python/blob/main/workshops/basics/basics-solutions.ipynb"
  loops: "https://colab.research.google.com/github/NCSU-Libraries/getting-started-with-python/blob/main/workshops/loops-and-functions/loops-and-functions.ipynb"
  loops-filled: "https://colab.research.google.com/github/NCSU-Libraries/getting-started-with-python/blob/main/workshops/loops-and-functions/loops-and-functions-solutions.ipynb"
  eda: "https://colab.research.google.com/github/NCSU-Libraries/getting-started-with-python/blob/main/workshops/exploratory-data-analysis/exploratory-data-analysis.ipynb"
  repo: "https://github.com/NCSU-Libraries/getting-started-with-python"

# Colab's Python (the backup); keep `uv init --python` and conda.create's python= in step with it
python: "3.13"

# The uv version every command on the Setup page was checked against
checked:
  uv: "0.13.3"
  date: "October 20, 2026"
