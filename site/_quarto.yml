project:
  type: website
  output-dir: _site
  resources:
    - images/
  # Copies notebooks/*.ipynb into _site/notebooks/ for the Download links. Runs from site/.
  post-render: ../tools/copy_notebooks.py

website:
  title: "Introduction to Programming with Python"
  description: "From installing Python to writing your own function, on your own laptop, from NC State University Libraries' Data Science Services."
  site-url: "https://ncsu-libraries.github.io/dsti-python/"
  repo-url: "https://github.com/NCSU-Libraries/dsti-python"
  favicon: images/favicon.svg
  page-navigation: true
  bread-crumbs: false
  navbar:
    background: "#CC0000"
    foreground: "#FFFFFF"
    logo: images/lib_logo_white.png
    logo-alt: "NC State University Libraries"
    title: false
    collapse-below: lg
    left:
      - href: index.qmd
        text: Home
      - href: setup.qmd
        text: Setup
      - text: Notebooks
        menu:
          - href: setup.qmd#notebook
            text: "Download the notebooks"
          - href: "https://colab.research.google.com/github/NCSU-Libraries/dsti-python/blob/main/notebooks/introduction-to-programming-with-python.ipynb"
            text: "Learner notebook in Colab (backup)"
          - href: "https://colab.research.google.com/github/NCSU-Libraries/dsti-python/blob/main/notebooks/introduction-to-programming-with-python-solutions.ipynb"
            text: "Filled notebook in Colab"
      - href: cheatsheet.qmd
        text: Cheat sheet
    right:
      - href: slides/index.qmd
        text: Slides
      - icon: github
        href: "https://github.com/NCSU-Libraries/dsti-python"
        aria-label: "Source on GitHub"
  page-footer:
    left: "NC State University Libraries · [Data Science Services](https://www.lib.ncsu.edu/staff/department/data-science-services) · Help: [go.ncsu.edu/getdatahelp](https://go.ncsu.edu/getdatahelp)"
    right: "Content [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/) · Code MIT"

format:
  html:
    theme:
      light: [cosmo, theme/site.scss]
    toc: true
    toc-depth: 2
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    anchor-sections: true
    link-external-newwindow: true
    lang: en
